<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carrot搭子发布后台</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff8ee;color:#18324f;font:16px/1.5 "Microsoft YaHei",system-ui,sans-serif}.box{width:min(360px,calc(100% - 40px));padding:28px;background:#fff;border-radius:20px;box-shadow:0 12px 36px #7b491c25}h1{margin:0 0 18px;font-size:24px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;font:inherit}input{border:1px solid #ccd8e5;margin:8px 0 14px}button{border:0;background:#1d4f91;color:#fff;font-weight:700}.error{color:#b42318;margin-bottom:12px}</style>
</head>
<body><main class="box"><h1>Carrot搭子发布后台</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>管理员密码</label><input type="password" name="password" required autofocus><button type="submit">登录</button></form></main></body>
</html>
